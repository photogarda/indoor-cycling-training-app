name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Trainer.sln -c Release
      - name: Test
        run: dotnet test tests/Trainer.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Publish Trainer.exe
        run: dotnet publish src/Trainer.Desktop/Trainer.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Trainer-windows-x64
          path: publish/Trainer.exe

  mac:
    runs-on: macos-14
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        if: matrix.rid == 'osx-arm64'
        run: dotnet test tests/Trainer.Tests -c Release
      - name: Build Trainer.app
        run: ./build/package-mac.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Trainer-mac-${{ matrix.rid == 'osx-arm64' && 'apple-silicon' || 'intel' }}
          path: publish/Trainer-${{ matrix.rid }}.zip
