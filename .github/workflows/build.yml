name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Trainer.sln -c Release
      - name: Test
        run: dotnet test tests/Trainer.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Publish Trainer.exe
        run: dotnet publish src/Trainer.App/Trainer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Trainer-win-x64
          path: publish/Trainer.exe
